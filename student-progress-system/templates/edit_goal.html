{% extends "base.html" %}
{% block content %}
  <h2>Edit Goal</h2>
  <form method="post">
    <label>Title</label>
    <input type="text" name="title" value="{{ goal.title }}" required>
    <label>Description</label>
    <textarea name="description">{{ goal.description }}</textarea>
    <label>Subject</label>
    <input type="text" name="subject" value="{{ goal.subject }}">
    <label>Date</label>
    <input type="date" name="goal_date" value="{{ goal.goal_date }}" required>
    <label>Target Minutes</label>
    <input type="number" name="target_minutes" value="{{ goal.target_minutes }}">
    <button type="submit">Save</button>
  </form>
{% endblock %}
